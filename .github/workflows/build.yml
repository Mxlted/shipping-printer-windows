name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check for the pinned SDK
        id: sdk
        shell: pwsh
        run: |
          $version = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $installed = @(dotnet --list-sdks | Where-Object { $_.StartsWith("$version ") }).Count -gt 0
          "installed=$($installed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6.0.0
        if: steps.sdk.outputs.installed != 'true'
        with:
          global-json-file: global.json
      # Desktop integration checks run locally; see tests/ShippingPrinter.Checks/README.md.
      - name: Install pinned installer compiler
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipChecks
      - name: Save release packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ShippingPrinter-win-x64
          path: |
            dist/*.zip
            dist/*-Setup.exe
            dist/*.sha256
          if-no-files-found: error
